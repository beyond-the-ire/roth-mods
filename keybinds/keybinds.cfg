# keybinds.cfg — action-key rebinds for the keybinds plugin. Lives BESIDE plugin.so
# in mods/keybinds/. Lines are "action = key". Swap-or-set WITHIN the action's table: if the key
# already carries an action there, the two actions SWAP keys. '#' starts a comment. Unknown names
# warn and skip. Delete/empty this file (or ROTH_MODS=0 / --no-mods) for stock binds.
# ROTH_KEYBINDS_DUMP=1 prints both live tables at boot; ROTH_KEYBINDS=/path overrides this file.
#
# HELD actions (movement/look, polled while down; stock key):
#   move_forward (up)    move_backward (down)   strafe_left (comma)  strafe_right (period)
#   turn_left (left)     turn_right (right)     jump (a)             crouch (z)
#   look_up (kp7/home)   look_down (kp1/end)    look_recenter_up (kp9)  look_recenter_down (kp3)
# PRESS actions (one-shot; stock key):
#   fire (ctrl)          use_enter (enter)      inventory (i)        escape_menu (esc)
#   weapon_1..weapon_6 (1..6)                   sprint_toggle (capslock)
#   quicksave (f9)       quickload (f10)        show_version (f8)
#   weapon_overlay (f1)  subtitles (f2)         easy_select (f3)     mouse_swap (f5)
#   display_cycle (f6)   display_cycle_alt (f4) noop_f7 (f7)
#   gamma_up (c)         gamma_down (v)         snapshot (b)
#   view_scale_0 (0)     view_smaller (minus)   view_larger (equals)
#   flush_textures (f)   wireframe_map (l)      render_mode (m)
#   help_overlay (h)     dev_map_menu (w)       dev_open_door (space)
#   choice_up (up)       choice_down (down)     noop_n (n)           noop_t (t)
#
# Keys: a..z, 0..9, f1..f10, esc, tab, enter, space, ctrl, alt, lshift, rshift, capslock,
#   backspace, minus, equals, lbracket, rbracket, semicolon, quote, grave, backslash,
#   comma, period, slash, up, down, left, right, kp0..kp9 — or a raw set-1 scancode "0x2e".
#
# MENU-NAV virtual binds (menu_up/menu_down/menu_left/menu_right): the menus read the arrow
# scancodes HARDCODED, so these four are handled by the plugin INPUT SEAM (on_scancode) — while a
# menu owns input, the chosen key is translated to the arrow. During gameplay it's a passthrough.

# ---- WASD layout ----
# vacate W and Space in the PRESS table first (else they'd double-fire with the held binds):
dev_map_menu  = tab      # dev map menu off W
dev_open_door = o        # dev open-door off Space (Enter is still "use")

# WASD movement + Q/E turning + Space jump (held table):
jump          = space    # frees A for strafe
move_forward  = w
move_backward = s
strafe_left   = a
strafe_right  = d
turn_left     = q
turn_right    = e

# inventory on F (swap: the old F=flush_textures moves to I):
inventory     = f

# menu navigation W/S: OFF by default — the seam translation also fired inside
# the save-name freeform text field, eating W/S while typing. Arrows still navigate menus natively.
# Uncomment to enable (also demonstrates the on_scancode seam remap):
# menu_up   = w
# menu_down = s

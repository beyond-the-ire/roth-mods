# Release: on a version tag (v*), build every mod for BOTH platforms and attach one zip per mod
# to a GitHub Release. Each zip unpacks to a single ready-to-install mod folder containing both
# binaries (plugin.so for Linux, plugin.dll for Windows) plus the mod's config and README — the
# engine loads whichever binary matches the platform, so the same folder installs anywhere.
# Users extract it into <game>/mods/ next to the game executable.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release + upload assets

jobs:
  release-mods:
    runs-on: ubuntu-latest
    steps:
      - name: Check out roth-mods
        uses: actions/checkout@v4
        with:
          path: roth-mods

      - name: Check out the ROTH.C engine (for its SDK)
        uses: actions/checkout@v4
        with:
          repository: beyond-the-ire/ROTH.C
          path: ROTH.C

      - name: Install the Linux 32-bit and MinGW i686 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib gcc-mingw-w64-i686 binutils-mingw-w64-i686 zip

      - name: Build and package each mod (both platforms, one zip)
        run: |
          set -e
          mkdir -p out
          for mod in keybinds item_grabber doc_viewer debug_overlay; do
            echo "== building $mod (Linux) =="
            make -C "roth-mods/$mod"
            echo "== building $mod (Windows) =="
            make -C "roth-mods/$mod" CROSS=mingw
            i686-w64-mingw32-objdump -p "roth-mods/$mod/plugin.dll" | grep -qw roth_plugin_query_v1 \
              || { echo "FAIL: $mod plugin.dll does not export roth_plugin_query_v1"; exit 1; }
            # package the installable folder: both plugins + config + the mod's README
            stage="stage/$mod"
            mkdir -p "$stage"
            cp "roth-mods/$mod/plugin.so" "$stage/"
            cp "roth-mods/$mod/plugin.dll" "$stage/"
            cp roth-mods/$mod/*.cfg "$stage/" 2>/dev/null || true
            cp "roth-mods/$mod/README.md" "$stage/"
            (cd stage && zip -r "../out/$mod-${GITHUB_REF_NAME}.zip" "$mod")
            rm -rf stage
          done
          ls -l out/

      - name: Create the GitHub Release with the mod zips
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true

# Renderer Overhaul settings, written by the renderer.
# Lines are key=value, keys are case-insensitive, and '#' starts
# a comment.

# World render width in pixels. Zero follows the engine viewport.
internal_w=1280

# World render height in pixels. Zero follows the engine viewport.
internal_h=720

# How the game window is presented. The host default leaves the window mode
# alone.
window_mode=default

# Vertical synchronization used when the host presents a frame. Adaptive is
# used only where the host supports it.
present_mode=fifo

# Maximum host presents per second. Zero is uncapped.
fps_cap=0

# Horizontal field of view at the original 4:3 aspect. Zero preserves the
# original projection; wider output aspects gain horizontal view area either
# way.
fov_deg=0

# Turn this off to leave the original renderer completely untouched.
enabled=1

# Key that opens the renderer settings overlay.
overlay_key=f12

# How the world's light and distance are shaded. Original steps through the
# thirty-two shades the map was authored with, exactly as the game always
# has. Smooth follows the same shades continuously, so a wall or a floor
# darkens evenly instead of in bands. Modern lights the world instead: each
# room glows with the brightness it was built with, a fill and the light you
# carry are added to it, and distance stops darkening anything on its own.
shading_mode=authentic

# Brightness of the world image. One is the original picture, and the
# interface, the inventory and the menus keep theirs either way.
world_brightness=1

# Contrast of the world image, taken around mid grey and after the
# brightness. One is the original picture.
world_contrast=1

# How much light a room gives off from the brightness it was built with.
# Lower makes the world darker everywhere without touching what the map says
# is bright and what is dim.
room_light_gain=1

# The least light any surface receives, so nowhere is ever completely black.
# Zero is honest darkness.
room_light_floor=0

# A little light everywhere, so what nothing else reaches is still faintly
# visible.
ambient_light=0

# The colour of that fill. A neutral grey by day, something cooler at night.
ambient_color=666666

# How much of that fill there is.
ambient_intensity=0

# A real light where you are standing, in place of the original's pool on the
# screen. Surfaces facing you catch it and surfaces turned away do not.
player_light=0

# The colour of the light you carry. A warm white reads as a flame.
player_light_color=ffede0

# How bright the light you carry is.
player_light_intensity=0

# How far the light you carry reaches before it runs out. Smaller is a
# tighter pool around you.
player_light_range=800

# Lets the light you carry breathe the way a flame does. It is held well
# clear of going out, so it never gutters or strobes.
player_light_flicker=0

# How far the flame swings either side of the strength you set.
player_light_flicker_amount=0.3

# How quickly the flame's wave runs.
player_light_flicker_speed=1.8

# How bright people, creatures and things you can pick up are: both the light
# they show of their own and the light you carry landing on them. Raise it if
# a dark room makes them hard to find.
sprite_light_gain=1

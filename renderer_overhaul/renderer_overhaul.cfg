# Renderer Overhaul settings, written by the renderer.
# Lines are key=value, keys are case-insensitive, and '#' starts
# a comment.

# World render width in pixels. Zero follows the engine viewport.
internal_w=1280

# World render height in pixels. Zero follows the engine viewport.
internal_h=720

# How the game window is presented. The host default leaves the window mode
# alone.
window_mode=default

# Vertical synchronization used when the host presents a frame. Adaptive is
# used only where the host supports it.
present_mode=fifo

# Maximum host presents per second. Zero is uncapped.
fps_cap=0

# Horizontal field of view at the original 4:3 aspect. Zero preserves the
# original projection; wider output aspects gain horizontal view area either
# way.
fov_deg=0

# Turn this off to leave the original renderer completely untouched.
enabled=1

# Key that opens the renderer settings overlay.
overlay_key=f12

# Which of the files in the game configs folder describes this game's maps.
# Each one says how particular places are lit; put one in that folder for a
# map pack.
game_config=roth

# How the world's light and distance are shaded. Original steps through the
# thirty-two shades the map was authored with, exactly as the game always
# has. Smooth follows the same shades continuously, so a wall or a floor
# darkens evenly instead of in bands. Modern lights the world instead: each
# room lights its own surfaces as far as the map says its light carries, and
# a fill and the light you carry are added to it.
shading_mode=authentic

# Brightness of the world image. One is the original picture, and the
# interface, the inventory and the menus keep theirs either way.
world_brightness=1

# Contrast of the world image, taken around mid grey and after the
# brightness. One is the original picture.
world_contrast=1

# How much light a room gives off from the brightness it was built with.
# Lower makes the world darker everywhere without touching what the map says
# is bright and what is dim.
room_light_gain=1

# How far into a room its own light reaches, against the distance the map
# authored for it. One is the map exactly as written; lower is a darker
# world, and it darkens a dim room long before it touches a lit one.
room_light_reach=0.85

# The least any surface is ever left showing, as a share of the brightest the
# picture can be drawn: a hundredth is about two levels out of two hundred
# and fifty-five, a tenth is about twenty-five. It lifts what has no light
# and leaves what has alone, so a dark room stays dark and stays readable.
# Zero is honest darkness.
room_light_floor=0

# A real light where you are standing, in place of the original's pool on the
# screen. Surfaces facing you catch it and surfaces turned away do not.
player_light=1

# The colour of the light you carry. A warm white reads as a flame.
player_light_color=ffede0

# How bright the light you carry is. It shows most where a room's own light
# has run out; near you the picture is already as bright as it can be drawn.
player_light_intensity=0.01

# How far the light you carry reaches before it runs out, in world units.
# Zero follows the reach the map itself authored for its own candlelight.
# Smaller is a tighter pool around you.
player_light_range=0

# How far in front of you the light you carry sits, as a share of how far it
# reaches. The game's own candlelight is aimed where you are looking rather
# than pooled at your feet. Zero puts it back on top of you.
player_light_forward=0

# Rooms lit by candlelight are lit by YOUR light in this game: the room says
# how far its own light carries and the candle you hold supplies the rest.
# This is how much of that your light gives. Full is the game's own candle.
# Turn it down and candlelit rooms go dark around you, leaving only the light
# the room itself has.
player_light_candle=0.45

# The game's candlelight brightens a whole candlelit room evenly, however far
# away the wall is. This gathers it into a pool around you instead: bright at
# your feet, gone by the time your light runs out, and dimmer on surfaces
# facing away.
player_light_candle_pool=0

# Your candlelight is a cone about where you are looking, and the game
# switches it from light to dark at one pace -- a flashlight's rim. This
# spreads that transition over a wider band, so the edge reads as a lantern's
# soft falloff instead. The middle of the cone and the darkness beyond it
# stay where they are; zero is the game's own edge.
player_light_penumbra=0.5

# Lets your candlelight move the way the game's own does: the pool of light
# wanders about where you are looking, the way a flame throws it. It never
# strobes and never gutters out.
player_light_flicker=1

# How far the pool of light wanders about where you are looking. Full is the
# game's own throw; at nothing the flame is perfectly still.
player_light_flicker_amount=0.2

# How quickly the flame moves: the pace the pool wanders to new places, and
# how briskly it settles on each.
player_light_flicker_speed=3

# How bright people, creatures and things you can pick up are: both the light
# they show of their own and the light you carry landing on them. Raise it if
# a dark room makes them hard to find.
sprite_light_gain=1

# Lets the torches, candles and lit sigils a map places actually light what
# is around them. How many of them cast shadows is a setting of its own
# below; one that casts none spills a little onto the far side of a doorway.
point_light=1

# Where those lights come from: the things a map marks as giving light of
# their own. Turning this off leaves the switch above on with nothing left
# for it to light with.
point_light_objects=1

# The other place those lights come from: the textures and faces a game
# config says give light, such as lava. Nothing glows until a game config
# names it, so on an undescribed game this costs nothing either way.
point_light_glow_faces=1

# How many of those lights may be giving light at the same time, nearest and
# strongest first. The default covers the game's fullest torch halls; the top
# of the dial is the renderer's own table, sixty-four lights in one drawing
# pass, which is also where the shadow storage below tops out -- a real
# bound, not a chosen one. Each burning light is a little arithmetic on every
# pixel: a hall with all sixty-four alight draws about a quarter slower than
# one with sixteen, whatever the window size.
point_light_max=16

# How many of them cast real shadows: walls, floors, doors and the things
# standing about block their light instead of it passing through. The ones
# that do are the ones lighting most of what you can see, so shadows arrive
# from the nearest and strongest outward. Nought is none at all, and anything
# from the row above upward is every light that burns. They are not free, in
# time or in memory: in a crowded hall at 3840x1600, eight of them draw about
# a quarter slower than none and sixteen about two fifths slower, less at
# smaller sizes and more where big pools overlap; and each one keeps a
# six-face map, about two and a half megabytes, so all sixty-four hold about
# 170 megabytes of card memory. A smaller graphics card may stand fewer maps
# than the dial asks and says so when it does.
point_light_shadows=4

# How much light one of them gives off.
point_light_intensity=1

# Where the pool around one of them ends, in world units. A fixed torch reads
# tighter than the light you carry, and a shorter reach is also less of it
# spilling where it should not.
point_light_range=450

# The colour a torch throws, unless a game config has named one for that
# particular thing. Warmer than the light you carry, because a wall torch is
# fire and a carried lamp is not.
point_light_color=ffb46e

# An outdoor light that casts in through a map's openings to the sky, with
# real shadows: walls, roofs, window bars and outside objects all block it.
# Maps with no sky openings are not affected.
sun_light=1

# The colour of the light from the sky. Cool and dim reads as moonlight, warm
# and strong as daylight; a game config may name a different colour per map.
sun_color=b9c8ff

# How much light the sky light carries. At nothing the light is out and no
# shadows are drawn.
sun_intensity=0.8

# How high the sun or moon stands, in degrees. Low means long shadows and
# light reaching deep through side windows; high means short shadows under
# things.
sun_elevation_deg=45

# Where the sun or moon stands over the map, as a compass bearing: 0 is north
# (the top of the map as the editor shows it), 90 east, 180 south, 270 west.
# Maps were built with no sun, so which windows catch the light is a per-map
# choice; a game config may aim it per map.
sun_yaw_deg=0

# How finely the sky light's shadows resolve. Medium is sharp enough for
# window bars to draw their own pattern on the floor; Low trades fineness and
# the soft edge for speed; High doubles the detail again and widens the
# softness range.
sun_shadow_quality=medium

# Whether trees, statues and characters cast shadows in the sky light. Their
# shadows are flat silhouettes, rough on purpose; off leaves only the world
# itself casting.
sun_object_shadows=1

# How wide a shadow's edge goes over from dark to lit. Nothing is a hard
# edge, the default is barely softened, and the top of the dial is a hand's
# width of penumbra. Low quality always keeps the hard edge.
sun_shadow_softness=0.1

# Saving this file while the game is running reloads all valid settings.
# A malformed edit is rejected as a whole, leaving the current settings active.

# Set to 0 to leave the original renderer completely untouched.
enabled=1

# Print map geometry and texture archive statistics when a map loads.
debug=0

# World render resolution. Zero follows the engine viewport for that dimension.
internal_w=0
internal_h=0

# Window mode: default, windowed, or borderless.
window_mode=default

# Presentation mode: fifo, immediate, or adaptive.
present_mode=fifo

# Zero is uncapped. A nonzero value is converted to a present interval.
fps_cap=0

# Horizontal FOV at the original 4:3 aspect. Zero preserves the original
# projection; wide resolutions automatically gain horizontal view area.
fov_deg=0

# Reserved renderer settings. They do not change this build's output yet.
pitch_mode=horizon_shift
render_mode=authentic

# Renderer Overhaul look file: how individual places are lit.
#
# This file is optional and the game never writes it. It sits beside
# renderer_overhaul.cfg and answers a different question: the settings file says
# what you want everywhere, and this one says what a particular map wants.
#
# Lines are key=value, keys are case-insensitive, and '#' starts a comment --
# so a colour is written as six bare hexadecimal digits, red then green then
# blue, with no hash in front of it.
#
# Only the settings that describe how a place looks may appear here; the
# settings screen owns everything else. A line this file cannot use costs that
# line and nothing more, and the game reports it when it reads the file.
#
# There are three kinds of section, and a later one wins over an earlier one:
#
#   [look]         applies to every map
#   [profile.NAME] a named set, applied wherever a map asks for it
#   [map.NAME]     applies to one map, named by its own file without the folder
#                  and without the extension
#
# And one of a different kind, because it is keyed by a thing rather than by a
# setting: [lights] says what particular objects give off, where one setting for
# a whole map is not enough. Its lines are
#
#   <graphic> = strength, reach, colour      a dash keeps what was set before it
#   <graphic> = off                          not a light, whatever the map marks
#
# It follows the same chain: [profile.NAME.lights] and [map.NAME.lights] are its
# profile and per-map forms, and each field composes on its own. Nothing has to
# be listed for a map's torches to work -- the game already marks them.
#
#   [lights]
#   0x0412 = 1.6, 520, ffb46e
#   0x0301 = off
#
#   [map.STUDY1.lights]
#   0x0412 = 2.0, -, -
#
# Nothing below is in force as it ships. The two profiles are here to be read,
# changed, and pointed at whichever maps you want them on. Point a map at one by
# naming it, and add any keys of its own underneath, which win over the
# profile's:
#
#   [map.STUDY1]
#   profile = night
#   player_light_intensity = 0.75

[profile.day]
shading_mode           = modern
ambient_light          = on
ambient_color          = 666666
ambient_intensity      = 0.60
player_light           = on
player_light_color     = ffede0
player_light_intensity = 0.35
player_light_range     = 600

[profile.night]
shading_mode           = modern
ambient_light          = on
ambient_color          = 576180
ambient_intensity      = 0.15
player_light           = on
player_light_color     = ffede0
player_light_intensity = 0.60
player_light_range     = 600

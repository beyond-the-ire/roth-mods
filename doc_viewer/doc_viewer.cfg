# doc_viewer.cfg — the document-viewer overlay plugin. Lives BESIDE plugin.so in
# mods/doc_viewer/. It enlarges the inventory "inspect document" popup in the wide/hi-res video
# modes and fixes the ornate side-frame art (mirror-tiled so it no longer over-reads neighbouring
# ICONS.ALL sprites). It is a FULL replacement of render_inspect_popup_window (canon 0x18e9e).
#
#   enabled = 1        master switch. When 0 the registered override PASSES THROUGH to the pristine
#                      engine function (byte-for-byte original) — nothing is enlarged.
#   scale   = 125x225  enlarged size as a percentage of the clamped maximum (single value = both;
#                      100..400; only ever GROWS the box). Default 125x225.
#   side_h  = 150,150  safe SOURCE height of the tiled left,right side columns (single value = both;
#                      kept under the art's true rows so the RLE blit never over-reads). Default 150.
#
# Env overrides (env WINS over this file):
#   ROTH_DOC_VIEWER=0|1              master switch
#   ROTH_DOC_VIEWER_SCALE="125x225"  enlarged size %
#   ROTH_DOC_VIEWER_SIDE_H="150,150" safe side-column source height
#   ROTH_DOC_VIEWER_DUMP=1           log the popup geometry + resolved side-sprite dims once
#
# Missing file (or ROTH_MODS=0 / --no-mods) = the plugin is not loaded at all = pristine engine.
enabled = 1
scale   = 125x225
side_h  = 150,150

# Debug Overlay
#
# F11 cycles PERFORMANCE -> INSPECTOR -> DETAILED -> ALL -> OFF.
# Boolean options accept 1/0, true/false, yes/no, or on/off.

# Master switch. Set to 0 to leave every overlay callback inert.
enabled = 1

# Layout shown when the mod loads: performance, inspector, detailed, all, or off.
initial_mode = performance

# Show host present-loop iterations per second and their average interval.
show_present_rate = 1

# Show observed engine timer ticks per second.
show_tick_rate = 1

# Show engine-frame compose callbacks per second.
show_compose_rate = 1

# Show game-thread frame callbacks per second.
show_game_rate = 0

# Show the rolling minimum and maximum host present intervals.
show_frame_intervals = 1

# Show the applied window mode, present mode, and minimum present interval.
show_window_state = 0

# Show the current RAW map name and DAS resource filename.
show_map = 1

# Show raw player coordinates and the current sector number/record offset.
show_player_location = 1

# Show yaw, requested/applied pitch, video dimensions, and logical aspect.
show_view = 1

# Show cursor classification, surface kind, FAT index, texel, and draw flags.
show_cursor = 1

# In DETAILED/ALL, show sector ID, glow, heights, textures, and mid-platform.
show_sector_details = 1

# In DETAILED/ALL, show the cursor face/sector numbers and face textures.
show_face_details = 1

# Overlay text refreshes per second. Values are clamped to the range 1-20.
update_hz = 4

# Screen corner: top_left, top_right, bottom_left, or bottom_right.
anchor = top_left

# Draw an opaque backing panel. Set to 0 for shadowed text only.
background = 1

# Key that advances to the next layout. Accepts a common key name or set-1 0xNN.
mode_key = f11

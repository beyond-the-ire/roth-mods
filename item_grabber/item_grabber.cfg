# item_grabber.cfg — the F7 item-grabber overlay plugin. Lives BESIDE plugin.so in
# mods/item_grabber/. It's a cheat/dev tool, so it is opt-in: this file enables it.
#
#   enabled = 1     # master switch (env ROTH_ITEM_GRABBER=0|1 overrides this)
#   key     = f7    # toggle key (keybinds key names, or a raw 0xNN scancode)
#
# Missing file (or enabled=0, or ROTH_MODS=0 / --no-mods) = disabled.
#
# Controls: F7 opens/closes; hover = name in the bottom bar; left-click = grant; click a tab to filter;
# just type to search (backspace edits); up/down arrows or [ ] scroll. Env knobs:
#   ROTH_ITEM_GRABBER_SENS, _PANEL="WxH", _DIM="N|NxP|off", _TEXT_COLOR=N, _ACCENT_COLOR=N,
#   _FRAME=0, _FRAME_BG=N, _FRAME_STRIP_H=N, _SPINE_MIRROR=0, _OPEN=1 (dev force-open), _DEBUG=1.
enabled = 1
key     = f7
